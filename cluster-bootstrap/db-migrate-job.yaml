apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: toggle-master
spec:
  # 0 de propósito: falhas aqui (senha errada, schema com erro de sintaxe)
  # não são transitórias — repetir não muda o resultado, só atrasa o
  # diagnóstico (foi o que aconteceu: 3 tentativas erradas + kubectl wait
  # esperando os 180s inteiros por uma condição que nunca ia vir).
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              set -e
              echo ">>> Aplicando schema do auth-service..."
              psql "$AUTH_DB_URL" -f /sql/auth-init.sql
              echo ">>> Aplicando schema do flag-service..."
              psql "$FLAGS_DB_URL" -f /sql/flags-init.sql
              echo ">>> Aplicando schema do targeting-service..."
              psql "$TARGETING_DB_URL" -f /sql/targeting-init.sql
              echo ">>> Schema aplicado com sucesso nos 3 bancos."
          env:
            - name: AUTH_DB_URL
              valueFrom:
                secretKeyRef:
                  name: toggle-master-secret
                  key: auth-db-url
            - name: FLAGS_DB_URL
              valueFrom:
                secretKeyRef:
                  name: toggle-master-secret
                  key: flags-db-url
            - name: TARGETING_DB_URL
              valueFrom:
                secretKeyRef:
                  name: toggle-master-secret
                  key: targeting-db-url
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: db-init-sql
