name: bootstrap-cluster

# Disparo manual de propósito: isso não roda a cada push de serviço, só
# quando a infra (togglemaster-infra) é criada/recriada do zero.
on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: togglemaster

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Instalar Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      # Os CRDs do Prometheus Operator (Prometheus, Alertmanager etc, usados
      # pelo chart kube-prometheus-stack) excedem os 262144 bytes do limite
      # da annotation last-applied-configuration — mesmo com
      # "ServerSideApply=true" no syncOptions, o ArgoCD falhou em aplicá-los
      # (erro real visto: "metadata.annotations: Too long"). É um problema
      # conhecido desse chart específico; o workaround é instalar os CRDs
      # fora do fluxo normal do Helm/ArgoCD, direto via server-side apply.
      # Idempotente — seguro de rodar de novo numa infra que já tem os CRDs
      # (por isso fica aqui, não precisa de passo manual a cada bootstrap).
      - name: Instalar CRDs do Prometheus Operator (server-side apply)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm pull prometheus-community/kube-prometheus-stack --version 92.14.1 --untar --untardir /tmp/kps-chart
          for f in $(find /tmp/kps-chart -type f -name "crd-*.yaml"); do
            echo "Aplicando $f"
            kubectl apply --server-side --force-conflicts -f "$f"
          done

      # Nomes/identificadores são fixos no Terraform (togglemaster-auth, etc)
      # mesmo depois de destroy/recreate — só o hostname gerado muda.
      - name: Descobrir endpoints atuais na AWS
        id: aws-endpoints
        run: |
          echo "auth_db=$(aws rds describe-db-instances --db-instance-identifier togglemaster-auth --query 'DBInstances[0].Endpoint.Address' --output text)" >> "$GITHUB_OUTPUT"
          echo "flags_db=$(aws rds describe-db-instances --db-instance-identifier togglemaster-flags --query 'DBInstances[0].Endpoint.Address' --output text)" >> "$GITHUB_OUTPUT"
          echo "targeting_db=$(aws rds describe-db-instances --db-instance-identifier togglemaster-targeting --query 'DBInstances[0].Endpoint.Address' --output text)" >> "$GITHUB_OUTPUT"
          echo "redis=$(aws elasticache describe-cache-clusters --cache-cluster-id togglemaster-redis --show-cache-node-info --query 'CacheClusters[0].CacheNodes[0].Endpoint.Address' --output text)" >> "$GITHUB_OUTPUT"
          echo "sqs_url=$(aws sqs get-queue-url --queue-name togglemaster-events --query QueueUrl --output text)" >> "$GITHUB_OUTPUT"

      # ConfigMap fica versionado no gitops/ (o ArgoCD é quem aplica de
      # verdade) — aqui só reescrevemos os valores e comitamos, mesmo
      # mecanismo que os workflows de serviço usam pra tag de imagem.
      #
      # Substituímos pelo NOME DA CHAVE (redis-url:/aws-sqs-url:), não pelo
      # placeholder __ASSIM__ — se fosse pelo placeholder, só funcionaria na
      # primeira vez: depois que o valor real é commitado, o placeholder não
      # existe mais no arquivo, e uma próxima recriação da infra (com
      # endpoints novos) não acharia nada pra substituir, deixando o
      # ConfigMap preso no endpoint antigo. Casando pela chave, funciona
      # igual da primeira à centésima vez.
      - name: Atualizar endpoints no gitops/02-configmap.yaml
        run: |
          sed -i -E "s#^(\s*redis-url:).*#\1 \"redis://${{ steps.aws-endpoints.outputs.redis }}:6379\"#" gitops/02-configmap.yaml
          sed -i -E "s#^(\s*aws-sqs-url:).*#\1 \"${{ steps.aws-endpoints.outputs.sqs_url }}\"#" gitops/02-configmap.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/02-configmap.yaml
          if git diff --cached --quiet; then
            echo "Nada mudou"
          else
            git commit -m "bootstrap: atualiza endpoints do ConfigMap"
            git push
          fi

      # Secret NUNCA vai pro Git — aplicado direto no cluster, valores vindos
      # de GitHub Secrets + dos endpoints descobertos acima.
      - name: Aplicar Secret com credenciais reais
        env:
          AUTH_DB_URL: "postgres://auth_user:${{ secrets.DB_AUTH_PASSWORD }}@${{ steps.aws-endpoints.outputs.auth_db }}:5432/auth_db?sslmode=require"
          FLAGS_DB_URL: "postgres://flags_user:${{ secrets.DB_FLAGS_PASSWORD }}@${{ steps.aws-endpoints.outputs.flags_db }}:5432/flags_db?sslmode=require"
          TARGETING_DB_URL: "postgres://targeting_user:${{ secrets.DB_TARGETING_PASSWORD }}@${{ steps.aws-endpoints.outputs.targeting_db }}:5432/targeting_db?sslmode=require"
        run: |
          kubectl create namespace toggle-master --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic toggle-master-secret \
            --namespace toggle-master \
            --from-literal=auth-db-url="$AUTH_DB_URL" \
            --from-literal=flags-db-url="$FLAGS_DB_URL" \
            --from-literal=targeting-db-url="$TARGETING_DB_URL" \
            --from-literal=master-key="${{ secrets.MASTER_KEY }}" \
            --from-literal=service-api-key="${{ secrets.SERVICE_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Fase C (APM) — license key do New Relic, nunca em texto puro no
      # gitops/. O Collector lê isso via env var (extraEnvs no
      # 14-otel-collector-traces-app.yaml) e usa no header "api-key" do
      # exporter otlphttp/newrelic.
      - name: Aplicar Secret do New Relic
        run: |
          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic newrelic-license \
            --namespace observability \
            --from-literal=license-key="${{ secrets.NEWRELIC_LICENSE_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Fase E — contact points do Grafana Alerting (Discord + JSM
      # Operations/Opsgenie-compatible). Vai num Secret (não ConfigMap),
      # com o label grafana_alert: "1" que o sidecar do Grafana
      # (sidecar.alerts em 12-kube-prometheus-stack-app.yaml) lê sozinho —
      # nenhuma API key/webhook fica em texto puro no gitops/.
      #
      # A policy com "continue: true" nas duas primeiras rotas é o que faz
      # um único alerta notificar os dois contact points ao mesmo tempo —
      # sem isso, só o primeiro match na árvore de rotas dispararia.
      - name: Aplicar Secret de alerting do Grafana (contact points)
        run: |
          cat > /tmp/contactpoints.yaml <<EOF
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: discord-togglemaster
              receivers:
                - uid: discord-togglemaster
                  type: discord
                  settings:
                    url: "${{ secrets.DISCORD_WEBHOOK_URL }}"
            - orgId: 1
              name: jsm-operations
              receivers:
                - uid: jsm-operations
                  type: opsgenie
                  settings:
                    apiUrl: "${{ secrets.JSM_ALERT_API_URL }}"
                    apiKey: "${{ secrets.JSM_ALERT_API_KEY }}"
          EOF

          cat > /tmp/policies.yaml <<'EOF'
          apiVersion: 1
          policies:
            - orgId: 1
              receiver: discord-togglemaster
              routes:
                - receiver: discord-togglemaster
                  continue: true
                - receiver: jsm-operations
                  continue: true
          EOF

          kubectl create secret generic togglemaster-grafana-alerting \
            --namespace observability \
            --from-file=contactpoints.yaml=/tmp/contactpoints.yaml \
            --from-file=policies.yaml=/tmp/policies.yaml \
            --dry-run=client -o yaml | \
            kubectl label --local -f - grafana_alert=1 -o yaml | \
            kubectl apply -f -

          rm -f /tmp/contactpoints.yaml /tmp/policies.yaml

      # RDS não roda init.sql sozinho (isso é um mecanismo só da imagem
      # Docker do Postgres) — precisa aplicar o schema manualmente uma vez.
      - name: Rodar migração de schema nos 3 bancos
        run: |
          kubectl create configmap db-init-sql \
            --namespace toggle-master \
            --from-file=auth-init.sql=auth-service/db/init.sql \
            --from-file=flags-init.sql=flag-service/db/init.sql \
            --from-file=targeting-init.sql=targeting-service/db/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete job db-migrate --namespace toggle-master --ignore-not-found
          kubectl apply -f cluster-bootstrap/db-migrate-job.yaml

          # Não usamos `kubectl wait --for=condition=complete`: ele só
          # reconhece sucesso e fica parado até o timeout inteiro quando o
          # Job falha (foi exatamente o que aconteceu da primeira vez — 3
          # tentativas erradas em segundos, e o wait esperou os 180s à toa).
          #
          # E não dá pra confiar em `.status.conditions[0].type`: o array de
          # conditions de um Job pode ter "SuccessCriteriaMet" antes de
          # "Complete" (a ordem não é garantida), então checar só a posição
          # [0] pode nunca bater com "Complete" mesmo o Job tendo terminado
          # certinho — foi exatamente o que aconteceu aqui. Filtramos pelo
          # tipo certo em vez de confiar na posição.
          echo "Aguardando o Job terminar..."
          COMPLETE=""
          FAILED=""
          for i in $(seq 1 30); do
            COMPLETE=$(kubectl get job db-migrate -n toggle-master -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            FAILED=$(kubectl get job db-migrate -n toggle-master -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
            if [ "$COMPLETE" = "True" ] || [ "$FAILED" = "True" ]; then
              break
            fi
            sleep 5
          done

          echo "--- Logs do Job (Complete=${COMPLETE:-?} Failed=${FAILED:-?}) ---"
          kubectl logs -n toggle-master job/db-migrate --all-containers || true

          if [ "$COMPLETE" != "True" ]; then
            echo "Migração de schema falhou ou não terminou a tempo."
            exit 1
          fi
