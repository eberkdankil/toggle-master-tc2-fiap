apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: toggle-master
  labels:
    app: flag-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: 851725230347.dkr.ecr.us-east-1.amazonaws.com/toggle-master/flag-service:ab86dab
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: toggle-master-config
                  key: flag-service-port
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: toggle-master-config
                  key: auth-service-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: toggle-master-secret
                  key: flags-db-url
            # Fase 4 — observabilidade (OpenTelemetry). PROTOCOL é necessário
            # aqui porque o default do SDK Python é http/protobuf, diferente
            # do grpc que o Go usa — sem isso ele tentaria falar HTTP com a
            # porta 4317, que só fala gRPC.
            - name: OTEL_SERVICE_NAME
              value: "flag-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: toggle-master-config
                  key: otel-exporter-otlp-endpoint
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: toggle-master-config
                  key: otel-exporter-otlp-protocol
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: toggle-master
spec:
  selector:
    app: flag-service
  ports:
    - port: 8002
      targetPort: 8002
