# "App cuidando de app", mesmo padrão do ingress-nginx/metrics-server.
# kube-prometheus-stack = Prometheus + Alertmanager + Grafana + Prometheus
# Operator + node-exporter + kube-state-metrics, tudo num chart só.
#
# Prometheus/Alertmanager continuam sem persistência de propósito (retention
# curta de 6h já é suficiente pro demo, e perder histórico de métricas num
# restart não trava nada funcionalmente). O Grafana passou a ter persistência
# na Fase E (17-aws-ebs-csi-driver-app.yaml + 18-ebs-storageclass.yaml) —
# sem isso, qualquer coisa criada pela UI do Grafana que não vem de
# provisioning via arquivo (como a regra de alerta de 5xx do auth-service)
# se perdia a cada rollout restart/redeploy do Grafana.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "92.14.1"
    helm:
      values: |
        # CRDs instalados fora do ArgoCD (ver .github/workflows/bootstrap-cluster.yml)
        # — eles excedem o limite de tamanho de annotation do apply normal do
        # ArgoCD, então paramos de deixar o ArgoCD tentar (e falhar) sincronizar
        # especificamente esses recursos.
        crds:
          enabled: false

        # EKS tem control plane gerenciado — etcd/scheduler/controller-manager
        # não são expostos pra scrape (ao contrário de cluster self-managed).
        # Sem desabilitar isso, fica um monte de ServiceMonitor falhando à
        # toa nos logs/alertas.
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false

        grafana:
          persistence:
            enabled: true
            storageClassName: ebs-gp3
            size: 1Gi
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              # 256Mi causava OOMKilled (exit 137) no Grafana 13.x com os
              # módulos de alerting/sidecar de dashboards/datasources ativos.
              memory: 512Mi
          # Senha gerada automaticamente pelo chart num Secret
          # (kube-prometheus-stack-grafana) — não fica em texto puro aqui.
          # Recuperar com:
          #   kubectl -n observability get secret kube-prometheus-stack-grafana \
          #     -o jsonpath="{.data.admin-password}" | base64 -d

          # Fase D — dashboard custom precisa do Loki como datasource (o
          # chart do Loki não registra isso sozinho). O datasource do
          # Prometheus já vem pronto por padrão deste chart, só o Loki
          # precisava ser adicionado manualmente.
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.observability.svc.cluster.local:3100
              isDefault: false

          # Explícito (em vez de confiar no default do chart) — é o que faz
          # o Grafana reconhecer sozinho qualquer ConfigMap no namespace
          # observability com o label grafana_dashboard: "1" como um
          # dashboard pra importar (ver 16-grafana-dashboard-configmap.yaml).
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"

            # Fase E — contact points (Discord + JSM Operations) vêm de um
            # Secret (não ConfigMap), já que tem API key/webhook ali dentro.
            # O sidecar aceita "resource: both" só pros dashboards; pra
            # alerting dá pra mirar só em Secret (resource: secret) direto
            # — nada de texto puro no gitops/ (ver bootstrap-cluster.yml,
            # que monta e aplica esse Secret a partir de GitHub Secrets).
            alerts:
              enabled: true
              label: grafana_alert
              labelValue: "1"
              resource: secret

        prometheus:
          prometheusSpec:
            retention: 6h
            # Sem isso, o Prometheus só obedece ServiceMonitor/PodMonitor com
            # o label "release: kube-prometheus-stack" (comportamento default
            # do chart) — ignorando o ServiceMonitor que o chart do OTel
            # Collector cria sozinho (release Helm diferente). Resultado real
            # visto: metrica existe em /metrics do Collector, mas o Prometheus
            # nunca raspa dali (nao aparece nem na lista de targets).
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1Gi
            # storageSpec vazio = Prometheus Operator usa emptyDir (efêmero),
            # consistente com a decisão de não usar PVC por enquanto.

        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Os CRDs deste chart (Prometheus, Alertmanager etc) excedem os
      # 262144 bytes do limite da annotation "last-applied-configuration"
      # do apply client-side padrão — sem isso o ArgoCD falha em criar os
      # CRDs (erro "metadata.annotations: Too long") e o resto do chart
      # sobe normal só que sem os CRDs, deixando Prometheus/Alertmanager
      # sem nenhum pod criado ("ensure CRDs are installed first").
      - ServerSideApply=true
