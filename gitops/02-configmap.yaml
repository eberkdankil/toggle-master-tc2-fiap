# Os valores __ENTRE_UNDERSCORES__ são específicos de cada apply do
# Terraform (terraform/environments/aws) e MUDAM sempre que a infra é
# destruída e recriada — não têm como ficar hardcoded de forma estável.
#
# Por enquanto, depois de cada `terraform apply`, rode:
#   terraform output auth_db_endpoint / flags_db_endpoint / ... / sqs_queue_url / dynamodb_table_name
# e substitua os placeholders manualmente antes de aplicar este arquivo.
# Automatizar essa substituição (via CI) fica pra quando o pipeline for montado.
apiVersion: v1
kind: ConfigMap
metadata:
  name: toggle-master-config
  namespace: toggle-master
data:
  auth-service-port: "8001"
  flag-service-port: "8002"
  targeting-service-port: "8003"
  evaluation-service-port: "8004"
  analytics-service-port: "8005"

  auth-service-url: http://auth-service:8001
  flag-service-url: http://flag-service:8002
  targeting-service-url: http://targeting-service:8003

  redis-url: "redis://__REDIS_ENDPOINT__:6379"

  aws-sqs-url: "__SQS_QUEUE_URL__"
  aws-dynamodb-table: "ToggleMasterAnalytics"
  aws-region: "us-east-1"
