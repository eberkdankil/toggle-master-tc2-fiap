# Um prefixo por serviço, com rewrite de verdade (o nginx suporta, ao
# contrário do ALB) — tudo que o serviço expõe internamente (incluindo
# /health) fica acessível como /<prefixo>/<rota original>. Ex:
#   /auth/health        -> auth-service:/health
#   /auth/validate      -> auth-service:/validate
#   /auth/admin/keys    -> auth-service:/admin/keys
#   /flags/health       -> flag-service:/health
#   /flags/flags        -> flag-service:/flags
#   /flags/flags/<name> -> flag-service:/flags/<name>
#   /targeting/health        -> targeting-service:/health
#   /targeting/rules         -> targeting-service:/rules
#   /targeting/rules/<name>  -> targeting-service:/rules/<name>
#   /evaluation/health  -> evaluation-service:/health
#   /evaluation/evaluate -> evaluation-service:/evaluate
#   /analytics/health   -> analytics-service:/health
#
# O padrão "(/|$)(.*)" + rewrite "/$2" é o idiom padrão do ingress-nginx pra
# isso — bate vazio (raiz do serviço, sem handler, 404 esperado) ou o
# restante do path depois do prefixo.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toggle-master-ingress
  namespace: toggle-master
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
          - path: /flags(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: flag-service
                port:
                  number: 8002
          - path: /targeting(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: targeting-service
                port:
                  number: 8003
          - path: /evaluation(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: evaluation-service
                port:
                  number: 8004
          - path: /analytics(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: analytics-service
                port:
                  number: 8005
