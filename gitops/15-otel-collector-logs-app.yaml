# OTel Collector em modo "daemonset" — um pod por node, lê os logs de TODOS
# os containers do cluster (via hostPath /var/log/pods) e manda pro Loki.
# É a peça que cumpre literalmente o requisito "Loki centraliza TODOS os
# logs dos contêineres do cluster", sem precisar instalar Promtail/Grafana
# Agent separado — o próprio OTel Collector também é o coletor de log.
#
# `presets.logsCollection`/`kubernetesAttributes` fazem o trabalho pesado
# (parsing de log do containerd, RBAC pra ler metadata de pod/namespace) —
# só precisamos adicionar o exporter pro Loki e ligá-lo na pipeline.
#
# O exporter dedicado "loki" foi removido do distro contrib (não está mais
# na lista de exporters válidos da v0.178.0) — o Loki passou a aceitar OTLP
# nativo desde a v3.0, então agora usamos o exporter genérico "otlphttp"
# apontando pro endpoint /otlp dele (o Loki 3.6.11 confirmado em produção
# aqui já suporta isso).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector-logs
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.178.0"
    helm:
      releaseName: otel-collector-logs
      values: |
        mode: daemonset

        # Mesmo motivo do otel-collector-traces: image.repository não tem
        # mais default a partir da v0.178.0, e esse release usa
        # filelog/k8sattributes/loki — tudo exclusivo do distro "contrib".
        image:
          repository: otel/opentelemetry-collector-contrib

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi

        ports:
          otlp:
            enabled: false
          otlp-http:
            enabled: false

        service:
          enabled: false

        presets:
          logsCollection:
            enabled: true
            includeCollectorLogs: false
          kubernetesAttributes:
            enabled: true

        config:
          exporters:
            otlphttp/loki:
              endpoint: http://loki.observability.svc.cluster.local:3100/otlp
              tls:
                insecure: true
            debug:
              verbosity: basic
          service:
            pipelines:
              logs:
                exporters: [otlphttp/loki, debug]

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
